name: Mantener activa la base (ping)

# El plan gratuito de Supabase pausa el proyecto tras ~1 semana sin actividad.
# Cada 2 días este job hace un login con un usuario que no existe: la API consulta la base y
# responde 401. Si responde otra cosa (500, timeout), el job falla y GitHub avisa por correo.
# No crea ni modifica datos.
on:
  schedule:
    - cron: '17 12 */2 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/keep-alive.yml'

permissions: {}

jobs:
  ping:
    name: Ping a la API (login inexistente, se espera 401)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login con un usuario que no existe
        env:
          URL: https://auth-api-security.vercel.app/api/auth/login
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 60 -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -d '{"email":"keepalive-ping@example.com","password":"keepalive-ping-0000"}')
          echo "HTTP $code"
          if [ "$code" != "401" ]; then
            echo "::error::Se esperaba 401 y llegó $code: la base podría estar pausada o la API caída"
            exit 1
          fi
