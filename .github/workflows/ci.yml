name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Valores de prueba solo para este job (no son secretos reales): la app valida los
      # secretos JWT al importarse y se niega a arrancar sin ellos.
      JWT_SECRET: ci-access-Qm9x7Lk2VdP4wT8nZc1RbYh6SfJ3uAe5GoXiNvKt0
      JWT_REFRESH_SECRET: ci-refresh-f3Gz9WqLp2XnC7vBk1RtYh8JdSa5UeMoAi4NxKw6
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build

  integration:
    name: Integración con PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: authapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d authapi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base descartable del servicio de arriba: las pruebas la vacían en cada test.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/authapi_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/authapi_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Aplica las migraciones desde cero: si el SQL no se puede ejecutar, falla acá.
      - run: npx prisma migrate deploy
      # Compara la base resultante con schema.prisma: sale con error si las migraciones no reproducen el schema.
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run test:integration

  audit:
    name: Avisos de seguridad en dependencias de producción
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
